<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css//styles.css">
</head>

<body>
    <div class="container">
        <header>
            <p>MyOwnLibrary</p>
            <button class="add-book">Add book</button>       
        </header>

        <main>
            <h1>Reading List</h1>
            <table>
                <caption>Check books in your library</caption>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Pages</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>
                    
                </tbody>
            </table>
        </main>

        
    </div>
    
    <dialog class="dialog-modal">
        <form action="" method="">
            <p>
                <label for="title">Title:</label>
                <input type="text" id="title" name="bookTitle">
            </p>
            <p>
                <label for="author">Author:</label>
                <input type="text" id="author" name="bookAuthor">
            </p>
            <p>
                <label for="numOfPages">Number of pages:</label>
                <input type="tel" id="numOfPages" name="bookPages">
            </p>
            <p>
                    <label for="read">Read:</label>
                    <input type="text" id="read" name="bookStatus" placeholder="Yes or No">
            </p>
            <button type="submit" class="submit">Save changes</button>
        </form>
    </dialog>
    <script src="js/app.js"></script>
</body>
</html>
